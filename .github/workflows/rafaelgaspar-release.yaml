name: rafaelgaspar Release

on:
  push:
    branches:
      - rafaelgaspar
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish (branch tip after tag-bump)
        type: string
        required: false
        default: rafaelgaspar
      upstream_tag:
        description: Upstream tag the stack was rebuilt onto
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  release:
    name: Tag and publish HTML5 tarball + deb
    if: github.repository == 'rafaelgaspar/xpra-html5'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Checkout fork-pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafaelgaspar/fork-pack
          ref: main
          path: .fork-pack

      - name: Configure git
        run: |
          git config user.name "Rafael Antunes"
          git config user.email "me@rafaelgaspar.xyz"

      - name: Fetch upstream tags
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Xpra-org/xpra-html5.git
          else
            git remote add upstream https://github.com/Xpra-org/xpra-html5.git
          fi
          git fetch --tags upstream

      - name: Resolve integration tag
        id: release
        run: |
          chmod +x .fork-pack/scripts/resolve-integration-tag.sh
          .fork-pack/scripts/resolve-integration-tag.sh 'v[0-9]*' '^v[0-9]+$' "${{ inputs.upstream_tag }}"

      - name: Syntax-check patched JS
        run: |
          for f in Menu.js MenuCustom.js Client.js Window.js; do
            node --check "html5/js/${f}"
          done

      - name: Build upstream-style tarball
        id: tarball
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.integration_version }}"
          staging="$(mktemp -d)"
          mkdir -p "${staging}/xpra-html5-${version}/html5"
          cp -a html5/. "${staging}/xpra-html5-${version}/html5/"
          mkdir -p dist
          tar -czf "dist/xpra-html5-${version}.tar.gz" -C "${staging}" "xpra-html5-${version}"
          rm -rf "${staging}"
          echo "asset=xpra-html5-${version}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Map Debian version (integration deb)
        id: debian_ver
        if: steps.release.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          v="${{ steps.release.outputs.integration_version }}"
          if echo "$v" | grep -qE '^[0-9]+(\.[0-9]+)*-[0-9a-f]+-rafaelgaspar\.[0-9]+$'; then
            deb=$(printf '%s' "$v" | sed -E 's/^([0-9]+(\.[0-9]+)*)-([0-9a-f]+)-rafaelgaspar\.([0-9]+)$/\1~\3.rafaelgaspar.\4/')
            echo "debian_version=${deb}" >> "$GITHUB_OUTPUT"
          else
            echo "error: integration version ${v} is not a rafaelgaspar integration tag" >&2
            exit 1
          fi

      - name: Build xpra-html5 deb (debian:forky)
        if: steps.release.outputs.skip_release != 'true'
        env:
          FORKY_IMAGE: debian:forky@sha256:49c219ade93d7c11635c0d57e735ed82339a503a4376cd6957046c2bd4e5905b
          DEBIAN_VERSION: ${{ steps.debian_ver.outputs.debian_version }}
        run: |
          set -euo pipefail
          chmod +x packaging/debian/build-rafaelgaspar-xpra-html5-for-forky.sh
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DEBIAN_VERSION \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${FORKY_IMAGE}" \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                devscripts equivs python3 python3-setuptools \
                uglifyjs brotli libjs-jquery libjs-jquery-ui gnome-backgrounds \
                ca-certificates
              ./packaging/debian/build-rafaelgaspar-xpra-html5-for-forky.sh "${DEBIAN_VERSION}"
            '

      - name: Publish apt repo to GitHub Pages
        if: steps.release.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APT_PAGES_COMMIT_LABEL: ${{ steps.release.outputs.tag }}
          APT_LABEL: rafaelgaspar xpra-html5
          APT_DESCRIPTION: rafaelgaspar/xpra-html5 integration debs for Debian forky
          APT_GPG_ASC_FILENAME: rafaelgaspar-xpra-html5.gpg.asc
          APT_ARCHITECTURES: amd64
          APT_PAGES_README: |
            # rafaelgaspar/xpra-html5
            # Apt: https://rafaelgaspar.github.io/xpra-html5/apt
          FORKY_IMAGE: debian:forky@sha256:49c219ade93d7c11635c0d57e735ed82339a503a4376cd6957046c2bd4e5905b
          APT_SIGN_KEY_ID: ${{ vars.APT_SIGN_KEY_ID }}
          APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
          APT_REPO_GPG_PUBLIC_ARMOR: ${{ secrets.APT_REPO_GPG_PUBLIC_ARMOR }}
          RAFAELGASPAR_FORK_PACK: ${{ github.workspace }}/.fork-pack
        run: |
          set -euo pipefail
          chmod +x .fork-pack/scripts/debian/publish-apt-to-github-pages.sh
          .fork-pack/scripts/debian/publish-apt-to-github-pages.sh dist/debian

      - name: Create and push integration tag
        if: steps.release.outputs.skip_release != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -a "${TAG}" -m "rafaelgaspar integration release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.release.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.tarball.outputs.asset }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          rafaelgaspar integration release based on upstream ${{ steps.release.outputs.base_tag }}.

          - Upstream-style tarball (\`xpra-html5-<version>/html5/\`)
          - **Debian package** via \`python3 setup.py deb\` on debian:forky (same as Xpra-org/xpra-html5)
          - **Apt:** \`deb [signed-by=/usr/share/keyrings/rafaelgaspar-xpra-html5.gpg] https://rafaelgaspar.github.io/xpra-html5/apt forky main\`
            (key: https://rafaelgaspar.github.io/xpra-html5/apt/rafaelgaspar-xpra-html5.gpg.asc when signing is enabled)
          EOF
          )
          mapfile -t assets < <(find dist/debian -maxdepth 1 -name '*.deb' -type f 2>/dev/null | sort)
          if [[ -f dist/debian/deb-manifest.txt ]]; then
            assets+=(dist/debian/deb-manifest.txt)
          fi
          assets+=("dist/${ASSET}")
          gh release create "${TAG}" \
            --repo rafaelgaspar/xpra-html5 \
            --title "${TAG}" \
            --notes "${body}" \
            --target rafaelgaspar \
            "${assets[@]}"
